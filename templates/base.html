<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Job Hunting Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background: linear-gradient(to right, #eff6ff, #ffffff, #f0fdf4);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .logo {
            background: linear-gradient(to right, #3b82f6, #22c55e);
            width: 100px;
            height: 100px;
            display: inline-block;
            border-radius: 10px;
            margin-bottom: 1rem;
        }
        .main-heading {
            background: linear-gradient(to right, #2563eb, #16a34a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .sub-text {
            color: #4b5563;
            margin-bottom: 2rem;
            font-weight: bolder;
        }
        .feature-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 1rem;
        }
        .job-matching { background-color: #dbeafe; color: #2563eb; }
        .cv-generator { background-color: #dcfce7; color: #16a34a; }
        .career-support { background-color: #f3e8ff; color: #9333ea; }
        .btn-login {
            background: linear-gradient(to bottom, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 10px 20px;
            margin-right: 1rem;
        }
        .btn-login:hover {
            background: linear-gradient(to bottom, #2563eb, #1d4ed8);
        }
        .btn-register {
            color: #16a34a;
            border: 2px solid #22c55e;
            padding: 10px 20px;
            background: none;
        }
        .btn-register:hover {
            background-color: #22c55e;
            color: white;
        }
        .trust-text {
            color: #9ca3af;
            margin-top: 2rem;
        }
        .navbar {
            background-color: #ffffff;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid #e5e7eb;
        }
        .navbar-brand {
            font-size: 1.5rem;
            color: #2563eb;
            background: linear-gradient(to right, #3b82f6, #22c55e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
        }
        .navbar-brand i {
            margin-right: 0.5rem;
        }
        .navbar-nav .nav-link {
            color: #4b5563;
            font-weight: 500;
        }
        .navbar-nav .nav-link:hover {
            color: #2563eb;
        }
        .navbar-nav .nav-link.text-danger {
            color: #dc2626;
        }
        .navbar-nav .nav-link.text-danger:hover {
            color: #b91c1c;
        }
    </style>
</head>
<body>
{% if request.session.jobseeker_id %}
    <!-- Navbar Start -->
    <nav class="navbar navbar-expand-lg navbar-light w-100 shadow-sm">
        <div class="container-fluid">
            
<a class="navbar-brand fw-bold d-flex flex-column" href="{% url 'dashboard' %}">
    <span><i class="fas fa-brain me-1"></i> Job 360</span>
    <small class="text-muted" style="font-size: 0.8rem; margin-top: -4px;">AI-Powered Dashboard</small>
</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarContent">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'update_profile' %}"><i class="fas fa-user"></i> Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-danger" href="{% url 'logout' %}"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- Navbar End -->
    {% endif %}

    <div class="container mt-4">
        {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
{% endfor %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

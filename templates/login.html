{% extends 'base.html' %}
{% block content %}
    <div class="logo" style="background: linear-gradient(to right, #3b82f6, #22c55e); width: 100px; height: 100px; display: inline-block; border-radius: 10px; margin-bottom: 1rem;">
        <i class="fas fa-brain" style="color: white; font-size: 50px; margin: 25px;"></i>
    </div>
    <h1 class="main-heading">Join Job 360</h1>
    <p class="sub-text">Access your AI Job Portal account</p>
    <div class="card p-4" style="max-width: 420px; margin: 0 auto; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); text-align: left;">
        <h4 class="mb-2 text-start fw-bold text-center" style="color: #111827;">Login</h4>
        <p class="mb-4 text-start text-center" style="color: #6b7280;">Enter your details to access your account</p>
        <form method="post" class="needs-validation" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_email" class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" name="email" id="id_email" class="form-control" placeholder="Enter your email" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="id_password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter your password" required>
                </div>
            </div>
            <button type="submit" class="btn w-100 mt-2" style="background: linear-gradient(to bottom, #3b82f6, #2563eb); color: white; border: none; padding: 10px; border-radius: 5px;">
                Login <i class="fas fa-sign-in-alt"></i>
            </button>
        </form>
        <p class="text-center mt-3" style="color: #6b7280;">Don't have an account? <a href="{% url 'register' %}" class="text-decoration-none" style="color: #2563eb;">Register here</a></p>
        <p class="text-center mt-2"><a href="{% url 'index' %}" class="text-decoration-none" style="color: #6b7280;">← Back to Home</a></p>
    </div>
{% endblock %}
